<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel File Upload</title>
</head>
<body>
    <h2>Upload Excel File</h2>
    <form id="upload-form" enctype="multipart/form-data">
        <input type="file" id="file-input" name="file" accept=".xlsx, .xls">
        <button type="submit">Upload</button>
    </form>
    
    <div id="response"></div>

    <script>
        document.getElementById("upload-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            const fileInput = document.getElementById("file-input");
            const responseDiv = document.getElementById("response");
            
            if (!fileInput.files.length) {
                alert("Please select a file.");
                return;
            }

            // Show loading state
            responseDiv.innerText = "Processing file...";

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch("http://127.0.0.1:8000/upload/", {
                    method: "POST",
                    body: formData
                });

                const responseBody = await response.json();
                
                if (!response.ok) {
                    throw new Error(responseBody.detail || `HTTP error! Status: ${response.status}`);
                }

                // Pretty print the JSON response
                responseDiv.innerHTML = `<pre>${JSON.stringify(responseBody, null, 2)}</pre>`;
            } catch (error) {
                console.error("Error uploading file:", error);
                responseDiv.innerText = `Error: ${error.message || "An error occurred while uploading the file."}`;
            }
        });
    </script>
</body>
</html>
